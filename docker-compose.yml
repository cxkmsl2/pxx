services:
  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    container_name: pxx-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - pxx-net

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    image: pxx-server
    container_name: pxx-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=pxx
      - DB_PASS=pxx123456
      - DB_NAME=pxx
      - REDIS_ADDR=redis:6379
      - KAFKA_BROS=kafka:9092
      - SERVER_PORT=8080
      - JWT_SECRET=pxx-jwt-secret-2026
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pxx-net

  mysql:
    image: mysql:8.0
    container_name: pxx-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root123456
      MYSQL_DATABASE: pxx
      MYSQL_USER: pxx
      MYSQL_PASSWORD: pxx123456
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - ./mysql/my.cnf:/etc/mysql/conf.d/my.cnf:ro
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - pxx-net

  redis:
    image: redis:7-alpine
    container_name: pxx-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - pxx-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: pxx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - pxx-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: pxx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - pxx-net

  minio:
    image: minio/minio:latest
    container_name: pxx-minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: pxxadmin
      MINIO_ROOT_PASSWORD: pxxminio123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - pxx-net

volumes:
  mysql-data:
  minio-data:

networks:
  pxx-net:
    driver: bridge
